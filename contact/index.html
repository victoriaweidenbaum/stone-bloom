<body>
  <a class="skip-link" href="#page">Skip to Content</a>
  <header class="header header--light">
    <button class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
    <div class="header-social fade"><a class="icon-link" href="https://www.instagram.com/stone.bloom.art" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".9" fill="currentColor" stroke="none"/></svg></a></div>
    <div class="header-center">
      <a class="site-title fade" href="../">Stone Bloom</a>
      <nav class="header-nav fade" aria-label="Main"><a href="../clay-art/">Clay art</a><a href="../about/">About</a><a href="../contact/" aria-current=page>Contact</a></nav>
    </div>
  </header>
  <div class="menu" id="menu">
    <nav aria-label="Mobile"><a href="../clay-art/">Clay art</a><a href="../about/">About</a><a href="../contact/" aria-current=page>Contact</a></nav>
    <a class="icon-link" href="https://www.instagram.com/stone.bloom.art" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".9" fill="currentColor" stroke="none"/></svg></a>
  </div>
  <main id="page">
    <section class="section section--first section--light section--medium">
      <div class="fe" style="--rows-m:29;--rows-d:13">
        <div class="fe-block" style="--m:1/2/2/10;--d:1/2/3/7;--z:1"><div class="text fade"><h4>Get in Touch</h4></div></div>
        <div class="fe-block" style="--m:2/2/4/10;--d:2/2/4/8;--z:4"><div class="text fade"><p>For all inquiries, please contact vweidenbaum@gmail.com or use the form.</p></div></div>
        <div class="fe-block" style="--m:4/2/28/10;--d:1/12/12/26;--z:3"><form class="form fade" action="https://formsubmit.co/vweidenbaum@gmail.com" method="POST" data-ajax="https://formsubmit.co/ajax/vweidenbaum@gmail.com" data-success="Thank you!">
            <input type="hidden" name="_subject" value="New message from stonebloom.studio">
            <input type="hidden" name="_template" value="table">
            <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
            <fieldset>
              <legend>Name</legend>
              <div class="row">
                <div class="field"><label class="caption" for="first-name">First Name<span class="req">(required)</span></label><input id="first-name" type="text" name="First Name" autocomplete="given-name" required></div>
                <div class="field"><label class="caption" for="last-name">Last Name</label><input id="last-name" type="text" name="Last Name" autocomplete="family-name"></div>
              </div>
            </fieldset>
            <div class="field"><label class="title" for="email">Email<span class="req">(required)</span></label><input id="email" type="email" name="email" autocomplete="email" required></div>
            <div class="field"><label class="title" for="message">Message<span class="req">(required)</span></label><textarea id="message" name="Message" required></textarea></div>
            <button class="btn btn--large" type="submit">Submit</button>
          </form></div>
      </div>
    </section>
  </main>
  <footer class="footer section section--bright section--small section--top">
      <div class="fe" style="--rows-m:10;--rows-d:2">
        <div class="fe-block" style="--m:1/3/2/6;--d:1/4/3/8;--z:1"><div class="text fade"><h4>Stone bloom</h4></div></div>
        <div class="fe-block" style="--m:1/2/3/3;--d:1/2/3/3;--z:0"><div class="text fade"><h3>*</h3></div></div>
        <div class="fe-block" style="--m:3/2/6/6;--d:1/20/3/22;--z:2"><div class="text fade"><p><a href="../clay-art/">Clay art</a><br><a href="../about/">About</a><br><a href="../contact/">Contact</a></p></div></div>
        <div class="fe-block" style="--m:6/2/10/10;--d:1/22/2/26;--z:4"><div class="text fade"><p><a href="https://www.instagram.com/stone.bloom.art" target="_blank" rel="noopener">Instagram</a></p></div></div>
      </div>
  </footer>
  <script src="../js/main.js" defer></script>
</body>
</html>
